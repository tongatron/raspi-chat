<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Raspi Chat — Register</title>
  <meta name="description" content="Direct registration page for Raspi Chat." />
  <meta name="theme-color" content="#050505" />
  <meta name="robots" content="noindex,nofollow" />
  <meta property="og:title" content="Raspi Chat — Register" />
  <meta property="og:image" content="/chat/assets/logo-v2.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="/chat/assets/logo-v2.png" />
  <link rel="icon" type="image/x-icon" href="/chat/assets/favicon-v2.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/chat/assets/favicon-32-v2.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/chat/assets/icon-192-v2.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/chat/assets/register-entry.css" />
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <a class="pill" href="https://tongatron.github.io/" target="_blank" rel="noopener noreferrer">
        <img src="/chat/assets/logo-v2.png" alt="Tongatron" />
        <span>tongatron.github.io</span>
      </a>
      <a class="pill" href="/">Back to home</a>
    </div>

    <main class="card">
      <div class="eyebrow">Register</div>
      <h1>Join Raspi Chat</h1>
      <p class="lead">Create your account with a username and password. After your first login you will land straight in your initial room with the admin.</p>

      <label for="username-input">Username</label>
      <input id="username-input" type="text" autocomplete="username" maxlength="30" placeholder="Your name" />

      <label for="password-input" style="margin-top:14px;">Password</label>
      <input id="password-input" type="password" autocomplete="new-password" placeholder="Choose a password" />

      <label for="password-repeat-input" style="margin-top:14px;">Repeat password</label>
      <input id="password-repeat-input" type="password" autocomplete="new-password" placeholder="Repeat your password" />

      <div class="actions">
        <button class="btn primary" id="open-invite-btn" type="button">Register</button>
        <a class="btn ghost" href="/chat">Sign in</a>
      </div>

      <div class="status" id="status"></div>
      <div class="micro">Your initial room will be created automatically with the admin.</div>
    </main>
  </div>

  <script src="/chat/assets/register-entry.js"></script>
</body>
</html>
