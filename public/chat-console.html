<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Console Chat</title>
  <meta name="theme-color" content="#0d1420" />
  <meta property="og:title" content="Raspi Chat — Console" />
  <meta property="og:description" content="Administration console" />
  <meta property="og:image" content="/chat/assets/logo-v2.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="/chat/assets/logo-v2.png" />
  <link rel="icon" type="image/x-icon" href="/chat/assets/favicon-v2.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/chat/assets/favicon-32-v2.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/chat/assets/icon-192-v2.png" />
  <link rel="stylesheet" href="/chat/assets/chat-console.css" />
</head>
<body>
  <div class="shell">
    <section class="topbar">
      <div>
        <div class="eyebrow">Console</div>
        <h1>Raspberry and Chat</h1>
        <p class="copy">Quick dashboard to check Raspberry status, chat health, and connected services.</p>
      </div>
      <div class="actions">
        <a class="btn ghost" href="/chat">Back to chat</a>
        <button class="btn primary" id="refresh-btn" type="button">Refresh</button>
      </div>
    </section>

    <div id="status-line">Loading data...</div>

    <section class="grid" id="console-grid" hidden>
      <article class="card">
        <h2>Raspberry</h2>
        <div class="stats" id="raspberry-stats"></div>
      </article>

      <article class="card">
        <h2>Chat</h2>
        <div class="stats" id="chat-stats"></div>
      </article>

      <article class="card">
        <h2>Quick checks</h2>
        <div class="list" id="test-list"></div>
      </article>

      <article class="card">
        <h2>Network</h2>
        <div class="list" id="network-list"></div>
      </article>

      <article class="card full">
        <h2>Details</h2>
        <pre id="details"></pre>
      </article>
    </section>
  </div>

  <script src="/chat/assets/chat-console.js"></script>
</body>
</html>
