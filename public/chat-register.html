<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Raspi Chat — Register</title>
  <meta name="robots" content="noindex,nofollow" />
  <meta property="og:title" content="Raspi Chat — Registration" />
  <meta property="og:image" content="/chat/assets/logo-v2.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="/chat/assets/logo-v2.png" />
  <link rel="icon" type="image/x-icon" href="/chat/assets/favicon-v2.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/chat/assets/favicon-32-v2.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/chat/assets/icon-192-v2.png" />
  <link rel="stylesheet" href="/chat/assets/chat-register.css" />
</head>
<body>
  <main class="card">
    <div class="eyebrow">Private invite</div>
    <h1>Register</h1>
    <p class="copy">Complete your registration with a username and password. This link can be used only once.</p>
    <div class="invite-meta" id="invite-meta">Checking the link...</div>
    <div class="status" id="status"></div>
    <form class="form" id="register-form">
      <label>
        Name
        <input id="username" type="text" maxlength="30" autocomplete="username" placeholder="Your name" />
      </label>
      <label>
        Password
        <input id="password" type="password" autocomplete="new-password" placeholder="Choose a password" />
      </label>
      <label>
        Repeat password
        <input id="password-repeat" type="password" autocomplete="new-password" placeholder="Repeat your password" />
      </label>
      <div class="actions">
        <button id="submit-btn" type="submit">Register</button>
        <a id="login-link" class="button-link" href="/chat">Open chat</a>
      </div>
    </form>
  </main>

  <script src="/chat/assets/chat-register.js"></script>
</body>
</html>
