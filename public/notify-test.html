<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Test notification — Raspi Chat</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #14181f;
    color: #f3f7fd;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    padding: 20px;
  }
  .card {
    width: 100%;
    max-width: 360px;
    background: #1c2129;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 10px;
    padding: 24px;
  }
  h1 { font-size: 1.1rem; margin: 0 0 8px; }
  p { font-size: .88rem; line-height: 1.5; color: #b7c0cc; margin: 0 0 16px; }
  button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 6px;
    background: #1f6fd2;
    color: white;
    font-size: .95rem;
    font-weight: 700;
    cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: default; }
  button:hover:not(:disabled) { filter: brightness(1.08); }
  #status {
    margin-top: 16px;
    font-size: .84rem;
    white-space: pre-wrap;
    word-break: break-word;
    color: #b7c0cc;
  }
  #status.ok { color: #6fd08a; }
  #status.err { color: #e88; }
  .hint { margin-top: 20px; font-size: .78rem; color: #8891a0; }
</style>
</head>
<body>
  <div class="card">
    <h1>🔔 Test notification</h1>
    <p id="intro">Sends a real Web Push notification to your account. Once sent, close or switch away from the chat tab to confirm it still arrives.</p>
    <button id="send-btn" type="button">Send test notification</button>
    <div id="status"></div>
    <div class="hint">This window is independent from the chat app — you can close the chat tab without closing this one.</div>
  </div>
<script>
var username = localStorage.getItem('chat-user');
var token = localStorage.getItem('chat-token');
var statusEl = document.getElementById('status');
var btn = document.getElementById('send-btn');

if (!username || !token) {
  document.getElementById('intro').textContent = 'You need to be logged in to the chat first.';
  btn.disabled = true;
}

btn.onclick = async function() {
  btn.disabled = true;
  statusEl.className = '';
  statusEl.textContent = 'Sending…';
  try {
    var res = await fetch('/chat/test-push?to=' + encodeURIComponent(username), {
      headers: { 'X-Chat-Username': username, 'X-Chat-Token': token },
    });
    var data = await res.json();
    if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
    if (!data.webPushTestResult) {
      statusEl.className = 'err';
      statusEl.textContent = 'No push subscription found for ' + username + '. Enable notifications in the chat first (bell icon), then try again.';
    } else {
      var results = data.webPushTestResult;
      var failed = Array.isArray(results) && results.some(function(r) { return r.result !== 'sent'; });
      statusEl.className = failed ? 'err' : 'ok';
      statusEl.textContent = JSON.stringify(results, null, 2);
    }
  } catch (e) {
    statusEl.className = 'err';
    statusEl.textContent = 'Error: ' + e.message;
  } finally {
    btn.disabled = false;
  }
};
</script>
</body>
</html>
